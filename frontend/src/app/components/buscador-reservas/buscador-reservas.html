<section class="buscador-overlay" (click)="cerrar.emit()">
  <div class="buscador-modal" (click)="$event.stopPropagation()">
    <div class="buscador-header">
      <h3>Mis Reservas</h3>
      <button class="btn-cerrar" (click)="cerrar.emit()" aria-label="Cerrar">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>

    <!-- Selector de modo -->
    <div class="modo-selector">
      <button id="modoBtnRut" class="modo-btn" [class.active]="modo === 'rut'" (click)="seleccionarModo('rut')" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
        Buscar por RUT
      </button>
      <button id="modoBtnCorreo" class="modo-btn" [class.active]="modo === 'correo'" (click)="seleccionarModo('correo')" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        Correo
      </button>
      <button id="modoBtnTelefono" class="modo-btn" [class.active]="modo === 'telefono'" (click)="seleccionarModo('telefono')" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.56 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.91 9.91a16 16 0 0 0 6.06 6.06l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        Teléfono
      </button>
    </div>

    <!-- ===== RUT ===== -->
    <div class="buscar-form" *ngIf="modo === 'rut'">
      <div class="buscar-input-group">
        <label for="rutBuscar">RUT</label>
        <input id="rutBuscar" type="text" [(ngModel)]="identificador" (ngModelChange)="onIdentificadorChange($event)" placeholder="12345678-5" (keyup.enter)="buscar()">
      </div>
      <div class="buscar-input-group">
        <label for="contrasenaBuscarRut">Contraseña</label>
        <div class="pass-row">
          <input id="contrasenaBuscarRut" [type]="mostrarPass ? 'text' : 'password'" [(ngModel)]="contrasena" placeholder="Ingresa tu contraseña" (keyup.enter)="buscar()">
          <button class="btn-buscar" (click)="buscar()" [disabled]="!identificador.trim() || !contrasena.trim()">Buscar</button>
        </div>
      </div>
    </div>

    <!-- ===== CORREO ===== -->
    <div class="buscar-form" *ngIf="modo === 'correo'">
      <div class="buscar-input-group">
        <label for="correoBuscar">Correo Electrónico</label>
        <input id="correoBuscar" type="email" [(ngModel)]="identificador" placeholder="correo@ejemplo.cl" (keyup.enter)="buscar()">
      </div>
      <div class="buscar-input-group">
        <label for="contrasenaBuscarCorreo">Contraseña</label>
        <div class="pass-row">
          <input id="contrasenaBuscarCorreo" [type]="mostrarPass ? 'text' : 'password'" [(ngModel)]="contrasena" placeholder="Ingresa tu contraseña" (keyup.enter)="buscar()">
          <button class="btn-buscar" (click)="buscar()" [disabled]="!identificador.trim() || !contrasena.trim()">Buscar</button>
        </div>
      </div>
    </div>

    <!-- ===== TELÉFONO ===== -->
    <div class="buscar-form" *ngIf="modo === 'telefono'">
      <div class="buscar-input-group">
        <label for="telefonoBuscar">Teléfono</label>
        <input id="telefonoBuscar" type="tel" [(ngModel)]="identificador" placeholder="+56912345678" (keyup.enter)="buscar()">
      </div>
      <div class="buscar-input-group">
        <label for="contrasenaBuscarTel">Contraseña</label>
        <div class="pass-row">
          <input id="contrasenaBuscarTel" [type]="mostrarPass ? 'text' : 'password'" [(ngModel)]="contrasena" placeholder="Ingresa tu contraseña" (keyup.enter)="buscar()">
          <button class="btn-buscar" (click)="buscar()" [disabled]="!identificador.trim() || !contrasena.trim()">Buscar</button>
        </div>
      </div>
    </div>

    <p class="cargando-msg" *ngIf="cargando">Buscando reservas...</p>
    <p class="error-msg" *ngIf="errorMsg && !cargando">{{ errorMsg }}</p>

    <div class="tabla-wrapper" *ngIf="buscado && !cargando && reservas.length > 0">
      <p class="contador">Reservas encontradas: <strong>{{ reservas.length }}</strong></p>
      <table class="tabla-reservas">
        <thead>
          <tr><th>Sala</th><th>Fecha</th><th>Inicio</th><th>Fin</th><th>Estado</th></tr>
        </thead>
        <tbody>
          <tr *ngFor="let r of reservas">
            <td>{{ r.nombreSala }}</td>
            <td>{{ r.fechaReserva }}</td>
            <td>{{ r.horaInicio }}</td>
            <td>{{ r.horaTermino }}</td>
            <td>
              <span class="estado-badge" [class.confirmada]="r.nombreEstado === 'Confirmada'" [class.cancelada]="r.nombreEstado === 'Cancelada'">{{ r.nombreEstado }}</span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <p class="sin-reservas" *ngIf="buscado && !cargando && reservas.length === 0 && !errorMsg">No se encontraron reservas.</p>
  </div>
</section>
