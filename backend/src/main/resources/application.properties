spring.application.name=reservas
server.port=8080

# ==========================================================
# MySQL
# ==========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/reserva_salas_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate: crea las tablas automaticamente desde las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Ejecuta data.sql despues de que Hibernate cree las tablas
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Logger (configurado en logback-spring.xml)
logging.level.com.equipo6.reservas=INFO

# Graceful shutdown: permite que Spring cierre correctamente y loggee el evento
server.shutdown=graceful

# Force UTF-8 Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true
